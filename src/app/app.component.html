<main class="page">
  <header class="header">
    <h1>Snip</h1>
    <p class="subtitle">Paste a long URL, get a short one.</p>
  </header>

  <form class="link-form" (submit)="$event.preventDefault(); submit()">
    <input
      class="url-input"
      type="text"
      name="url"
      placeholder="https://example.com/very/long/path"
      autocomplete="off"
      [value]="url()"
      (input)="onUrlInput($any($event.target).value)"
    />
    <button class="submit-button" type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Shortening…' : 'Shorten' }}
    </button>
  </form>

  @if (error()) {
    <p class="message message-error">{{ error() }}</p>
  }

  @if (shortUrl()) {
    <p class="message message-success">
      Short link:
      <a [href]="shortUrl()" target="_blank" rel="noopener">{{ shortUrl() }}</a>
    </p>
  }

  <table class="links-table">
    <thead>
      <tr>
        <th>Code</th>
        <th>Original URL</th>
        <th>Hits</th>
      </tr>
    </thead>
    <tbody>
      @for (link of links(); track link.code) {
        <tr>
          <td>
            <a [href]="link.shortUrl" target="_blank" rel="noopener">{{ link.code }}</a>
          </td>
          <td class="url-cell">{{ link.url }}</td>
          <td>{{ link.hits }}</td>
        </tr>
      } @empty {
        <tr>
          <td colspan="3" class="empty-row">No links yet.</td>
        </tr>
      }
    </tbody>
  </table>
</main>
