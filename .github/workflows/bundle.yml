name: Build bundle

# No push trigger here on purpose: GitHub runs a push-triggered workflow using
# the copy of this file that exists on the branch that was pushed. This file
# only lives on main, so a push to backend/frontend/cli would never see it —
# hence the hourly schedule (plus manual dispatch) instead.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (with submodules)
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: true
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Rebuild bundle and push
        run: node scripts/build-bundle.mjs --push
